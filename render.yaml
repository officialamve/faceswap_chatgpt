services:
  - type: web
    name: private-face-swap-bot
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_TELEGRAM_ID
        sync: false
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: PORT
        value: "10000"
      - key: PROCESSING_TIMEOUT_SECONDS
        value: "600"
      - key: DOWNLOAD_TIMEOUT_SECONDS
        value: "60"
      - key: MAX_INPUT_BYTES
        value: "15728640"
      - key: MAX_IMAGE_PIXELS
        value: "20000000"
      - key: MAX_IMAGE_DIMENSION
        value: "8000"
      - key: TEMP_DIR
        value: /tmp/face-swap-bot
      - key: SOURCE_FACE_MODEL
        value: models/face_analysis
      - key: SWAP_MODEL
        value: models/inswapper_128.onnx
